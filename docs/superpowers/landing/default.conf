server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index landing.html;
    charset utf-8;

    # Browse the whole folder (book, interactive landings, the .md sources).
    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Show markdown as readable UTF-8 text instead of downloading it.
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }
}
